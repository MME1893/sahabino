x-sahabino-build: &sahabino-build
  context: .
  pull: false

services:
  postgres:
    image: postgres:16-alpine
    pull_policy: missing

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:4.3.1
    pull_policy: missing

    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,HOST://:9092,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    ports:
      - "9092:9092"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  api:
    build: *sahabino-build

    environment:
      SAHABINO_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      SAHABINO_KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      SAHABINO_LOG_FORMAT: "json"
      SAHABINO_LOG_LEVEL: "INFO"
      SAHABINO_ENVIRONMENT: "development"

    labels:
      com.sahabino.logs: "true"

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  crawler:
    build: *sahabino-build

    command: ["uv", "run", "--no-sync", "python", "-m", "sahabino.crawler", "scheduler"]

    environment:
      SAHABINO_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      SAHABINO_KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      SAHABINO_APPLICATION_REGISTRY_BASE_URL: "http://api:8000"
      SAHABINO_LOG_FORMAT: "json"
      SAHABINO_LOG_LEVEL: "INFO"
      SAHABINO_ENVIRONMENT: "development"

    labels:
      com.sahabino.logs: "true"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api:
        condition: service_healthy

  ingestion:
    build: *sahabino-build

    command: ["uv", "run", "--no-sync", "python", "-m", "sahabino.ingestion"]
    restart: on-failure

    environment:
      SAHABINO_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      SAHABINO_KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      SAHABINO_INGESTION_CONSUMER_GROUP_ID: "${SAHABINO_INGESTION_CONSUMER_GROUP_ID:-sahabino-ingestion-v1}"
      SAHABINO_LOG_FORMAT: "json"
      SAHABINO_LOG_LEVEL: "INFO"
      SAHABINO_ENVIRONMENT: "development"

    labels:
      com.sahabino.logs: "true"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  loki:
    image: grafana/loki:3.7.0
    pull_policy: missing
    profiles:
      - observability

    command: ["-config.file=/etc/loki/loki-config.yaml"]

    ports:
      - "3100:3100"

    volumes:
      - ./infrastructure/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.19.0
    pull_policy: missing
    profiles:
      - observability

    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "--storage.path=/var/lib/alloy/data",
        "/etc/alloy/config.alloy",
      ]

    ports:
      - "12345:12345"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data

    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.4.0
    pull_policy: missing
    profiles:
      - observability

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-sahabino}

    ports:
      - "3000:3000"

    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

    depends_on:
      - loki

volumes:
  postgres_data:
  kafka_data:
  loki_data:
  grafana_data:
  alloy_data:
