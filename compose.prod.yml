x-sahabino-production-runtime: &sahabino-production-runtime
  SAHABINO_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  SAHABINO_KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
  SAHABINO_KAFKA_TOPIC_PARTITIONS: "${SAHABINO_KAFKA_TOPIC_PARTITIONS:-3}"
  SAHABINO_KAFKA_TOPIC_REPLICATION_FACTOR: "${SAHABINO_KAFKA_TOPIC_REPLICATION_FACTOR:-1}"
  SAHABINO_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "${SAHABINO_KAFKA_CONSUMER_AUTO_OFFSET_RESET:-earliest}"
  SAHABINO_KAFKA_PRODUCER_QUEUE_FULL_MAX_RETRIES: "${SAHABINO_KAFKA_PRODUCER_QUEUE_FULL_MAX_RETRIES:-3}"
  SAHABINO_KAFKA_PRODUCER_QUEUE_FULL_POLL_TIMEOUT_SECONDS: "${SAHABINO_KAFKA_PRODUCER_QUEUE_FULL_POLL_TIMEOUT_SECONDS:-0.1}"
  SAHABINO_LOG_FORMAT: "json"
  SAHABINO_LOG_LEVEL: "${SAHABINO_LOG_LEVEL:-INFO}"
  SAHABINO_ENVIRONMENT: "production"

# Local SeaweedFS speaks the S3-compatible API. Nothing here configures AWS or
# remote object storage; us-east-1 is only the Signature V4 compatibility region.
x-sahabino-object-storage-runtime: &sahabino-object-storage-runtime
  SAHABINO_OBJECT_STORAGE_ENDPOINT_URL: "${SAHABINO_OBJECT_STORAGE_ENDPOINT_URL:-http://seaweedfs:8333}"
  SAHABINO_OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: "${SAHABINO_OBJECT_STORAGE_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:8333}"
  SAHABINO_OBJECT_STORAGE_BUCKET: "${SAHABINO_OBJECT_STORAGE_BUCKET:-sahabino-network-captures}"
  SAHABINO_OBJECT_STORAGE_ACCESS_KEY: "${SAHABINO_OBJECT_STORAGE_ACCESS_KEY}"
  SAHABINO_OBJECT_STORAGE_SECRET_KEY: "${SAHABINO_OBJECT_STORAGE_SECRET_KEY}"
  SAHABINO_OBJECT_STORAGE_REGION: "${SAHABINO_OBJECT_STORAGE_REGION:-us-east-1}"
  SAHABINO_OBJECT_STORAGE_PRESIGN_EXPIRY_SECONDS: "${SAHABINO_OBJECT_STORAGE_PRESIGN_EXPIRY_SECONDS:-900}"
  SAHABINO_OBJECT_STORAGE_MAX_CAPTURE_SIZE_BYTES: "${SAHABINO_OBJECT_STORAGE_MAX_CAPTURE_SIZE_BYTES:-2147483648}"

services:
  postgres:
    restart: unless-stopped
    ports: !override []

  kafka:
    restart: unless-stopped
    ports: !override []
    environment:
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092

  api:
    restart: unless-stopped
    environment:
      <<:
        - *sahabino-production-runtime
        - *sahabino-object-storage-runtime
    ports: !override
      - name: api
        target: 8000
        published: "${SAHABINO_API_PORT:-8000}"
        host_ip: "${SAHABINO_API_BIND_ADDRESS:-0.0.0.0}"
        protocol: tcp

  crawler:
    restart: unless-stopped
    environment:
      <<: *sahabino-production-runtime
      SAHABINO_APPLICATION_REGISTRY_BASE_URL: "http://api:8000"
      SAHABINO_PLAYSTORE_CRAWL_INTERVAL_MINUTES: "${SAHABINO_PLAYSTORE_CRAWL_INTERVAL_MINUTES:-60}"
      SAHABINO_PLAYSTORE_MAX_CONCURRENT_APPS: "${SAHABINO_PLAYSTORE_MAX_CONCURRENT_APPS:-3}"
      SAHABINO_PLAYSTORE_LANGUAGE_CODE: "${SAHABINO_PLAYSTORE_LANGUAGE_CODE:-en}"
      SAHABINO_PLAYSTORE_COUNTRY_CODE: "${SAHABINO_PLAYSTORE_COUNTRY_CODE:-us}"
      SAHABINO_PLAYSTORE_REQUEST_TIMEOUT_SECONDS: "${SAHABINO_PLAYSTORE_REQUEST_TIMEOUT_SECONDS:-20}"
      SAHABINO_PLAYSTORE_RETRY_MAX_ATTEMPTS: "${SAHABINO_PLAYSTORE_RETRY_MAX_ATTEMPTS:-3}"
      SAHABINO_PLAYSTORE_RETRY_MAX_DELAY_SECONDS: "${SAHABINO_PLAYSTORE_RETRY_MAX_DELAY_SECONDS:-30}"
      SAHABINO_PLAYSTORE_RATE_LIMIT_ENABLED: "${SAHABINO_PLAYSTORE_RATE_LIMIT_ENABLED:-true}"
      SAHABINO_PLAYSTORE_RATE_LIMIT_REFILL_PER_SECOND: "${SAHABINO_PLAYSTORE_RATE_LIMIT_REFILL_PER_SECOND:-1.0}"
      SAHABINO_PLAYSTORE_RATE_LIMIT_BURST_CAPACITY: "${SAHABINO_PLAYSTORE_RATE_LIMIT_BURST_CAPACITY:-2}"
      SAHABINO_PLAYSTORE_PROXY_ENABLED: "${SAHABINO_PLAYSTORE_PROXY_ENABLED:-false}"
      SAHABINO_PLAYSTORE_PROXY_URLS: "${SAHABINO_PLAYSTORE_PROXY_URLS:-[]}"
      SAHABINO_PLAYSTORE_PROXY_DIRECT_FALLBACK: "${SAHABINO_PLAYSTORE_PROXY_DIRECT_FALLBACK:-true}"
      SAHABINO_PLAYSTORE_PROXY_FAILURE_THRESHOLD: "${SAHABINO_PLAYSTORE_PROXY_FAILURE_THRESHOLD:-2}"
      SAHABINO_PLAYSTORE_PROXY_COOLDOWN_SECONDS: "${SAHABINO_PLAYSTORE_PROXY_COOLDOWN_SECONDS:-60}"
      SAHABINO_PLAYSTORE_PROXY_RATE_LIMIT_ROTATE_AFTER: "${SAHABINO_PLAYSTORE_PROXY_RATE_LIMIT_ROTATE_AFTER:-2}"
      SAHABINO_PLAYSTORE_CIRCUIT_BREAKER_ENABLED: "${SAHABINO_PLAYSTORE_CIRCUIT_BREAKER_ENABLED:-true}"
      SAHABINO_PLAYSTORE_CIRCUIT_BREAKER_FAILURE_THRESHOLD: "${SAHABINO_PLAYSTORE_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}"
      SAHABINO_PLAYSTORE_CIRCUIT_BREAKER_COOLDOWN_SECONDS: "${SAHABINO_PLAYSTORE_CIRCUIT_BREAKER_COOLDOWN_SECONDS:-60}"
      SAHABINO_PLAYSTORE_SECONDARY_ADAPTER_ENABLED: "${SAHABINO_PLAYSTORE_SECONDARY_ADAPTER_ENABLED:-true}"

  ingestion:
    restart: unless-stopped
    environment:
      <<: *sahabino-production-runtime
      SAHABINO_INGESTION_CONSUMER_GROUP_ID: "${SAHABINO_INGESTION_CONSUMER_GROUP_ID:-sahabino-ingestion-v1}"

  seaweedfs:
    restart: unless-stopped
    # Keep the optional local S3-compatible endpoint private to the VPS.
    ports: !override
      - name: s3
        target: 8333
        published: "8333"
        host_ip: 127.0.0.1
        protocol: tcp

  network-analyzer:
    restart: unless-stopped
    environment:
      <<:
        - *sahabino-production-runtime
        - *sahabino-object-storage-runtime
      SAHABINO_NETWORK_ANALYZER_CONSUMER_GROUP_ID: "${SAHABINO_NETWORK_ANALYZER_CONSUMER_GROUP_ID:-sahabino-network-analyzer-v1}"
      SAHABINO_NETWORK_TSHARK_PATH: "${SAHABINO_NETWORK_TSHARK_PATH:-tshark}"
      SAHABINO_NETWORK_TSHARK_TIMEOUT_SECONDS: "${SAHABINO_NETWORK_TSHARK_TIMEOUT_SECONDS:-120}"
      SAHABINO_NETWORK_PENDING_UPLOAD_EXPIRY_SECONDS: "${SAHABINO_NETWORK_PENDING_UPLOAD_EXPIRY_SECONDS:-3600}"
      SAHABINO_NETWORK_STALE_ANALYSIS_SECONDS: "${SAHABINO_NETWORK_STALE_ANALYSIS_SECONDS:-1800}"

  loki:
    restart: unless-stopped
    ports: !override
      - name: http
        target: 3100
        published: "3100"
        host_ip: 127.0.0.1
        protocol: tcp

  alloy:
    restart: unless-stopped
    ports: !override
      - name: http
        target: 12345
        published: "12345"
        host_ip: 127.0.0.1
        protocol: tcp

  grafana:
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
    ports: !override
      - name: http
        target: 3000
        published: "3000"
        host_ip: 127.0.0.1
        protocol: tcp
