---
- name: Wait for the API health target
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ sahabino_api_port }}/docs"
    method: GET
    status_code: 200
  register: sahabino_api_health
  retries: "{{ sahabino_healthcheck_retries }}"
  delay: "{{ sahabino_healthcheck_delay_seconds }}"
  until: sahabino_api_health.status == 200

- name: Verify loopback observability ports are accepting connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    state: started
    timeout: 60
  loop:
    - 3000
    - 3100
    - 12345

- name: Wait for the SeaweedFS S3 port
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if sahabino_object_storage_bind_address == '0.0.0.0' else sahabino_object_storage_bind_address }}"
    port: 8333
    state: started
    timeout: 60

- name: Read the effective SeaweedFS runtime identity
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['exec', '-T', 'seaweedfs', 'id', '-un'] }}"
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_seaweedfs_identity
  changed_when: false

- name: Require the pinned image's non-root SeaweedFS identity
  ansible.builtin.assert:
    that:
      - sahabino_seaweedfs_identity.stdout | trim == sahabino_seaweedfs_runtime_user
      - sahabino_seaweedfs_identity.stdout | trim != 'root'
    fail_msg: SeaweedFS is not running as the expected non-root runtime identity.

- name: Read the effective numeric SeaweedFS runtime identity
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['exec', '-T', 'seaweedfs', 'sh', '-c', 'id -u; id -g'] }}"
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_seaweedfs_numeric_identity
  changed_when: false

- name: Match the running identity to the inspected pinned image account
  ansible.builtin.assert:
    that:
      - sahabino_seaweedfs_numeric_identity.stdout_lines == sahabino_seaweedfs_image_identity.stdout_lines
    fail_msg: The running SeaweedFS UID/GID differs from the pinned image runtime account.

- name: Verify credentials are readable by the effective SeaweedFS identity
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['exec', '-T', 'seaweedfs', 'test', '-r', '/etc/seaweedfs/s3.json'] }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: false

- name: Read running Compose services
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['ps', '--services', '--filter', 'status=running'] }}"
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_running_services_command
  changed_when: false

- name: Verify all requested production services are running
  ansible.builtin.assert:
    that:
      - >-
        (sahabino_infrastructure_services
         + sahabino_application_services
         + sahabino_observability_services)
        | difference(sahabino_running_services_command.stdout_lines)
        | length == 0
    fail_msg: One or more requested Sahabino production services are not running.

- name: Verify capture bucket access with production credentials
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['run', '--rm', '--no-deps', 'api', 'uv', 'run', '--no-sync', 'python', '-m', 'sahabino.network', 'storage-init'] }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: false
  no_log: true

- name: Verify TShark exists in the running analyzer image
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['exec', '-T', 'network-analyzer', sahabino_network_tshark_path, '--version'] }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: false

- name: Verify the analyzer has joined its configured Kafka consumer group
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['exec', '-T', 'kafka', 'timeout', '20s', '/opt/kafka/bin/kafka-consumer-groups.sh', '--bootstrap-server', 'kafka:19092', '--describe', '--members', '--group', sahabino_network_analyzer_consumer_group_id] }}"
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_network_group
  changed_when: false
  retries: "{{ sahabino_healthcheck_retries }}"
  delay: "{{ sahabino_healthcheck_delay_seconds }}"
  until:
    - sahabino_network_group.rc == 0
    - sahabino_network_analyzer_consumer_group_id in sahabino_network_group.stdout
    - "'CONSUMER-ID' in sahabino_network_group.stdout"

- name: Record the successful resolved revision outside the repository
  ansible.builtin.copy:
    content: "{{ sahabino_resolved_revision }}\n"
    dest: "{{ sahabino_app_parent_dir }}/DEPLOYED_REVISION"
    owner: "{{ sahabino_deploy_user }}"
    group: "{{ sahabino_deploy_group }}"
    mode: "0644"
