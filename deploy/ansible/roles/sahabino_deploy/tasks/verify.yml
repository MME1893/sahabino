---
- name: Wait for the API health target
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ sahabino_api_port }}/docs"
    method: GET
    use_proxy: false
    status_code: 200
  register: sahabino_api_health
  retries: "{{ sahabino_healthcheck_retries }}"
  delay: "{{ sahabino_healthcheck_delay_seconds }}"
  until: sahabino_api_health.status == 200

- name: Verify loopback observability ports are accepting connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    state: started
    timeout: 60
  loop:
    - 3000
    - 3100
    - 12345

- name: Verify the SeaweedFS S3 port is accepting connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8333
    state: started
    timeout: 60

- name: Discover expected services from the merged production model
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['config', '--services'] }}"
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_verify_expected_services_command
  changed_when: false

- name: Read running Compose services
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['ps', '--services', '--filter', 'status=running'] }}"
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_running_services_command
  changed_when: false

- name: Record missing production services
  ansible.builtin.set_fact:
    sahabino_verify_expected_services: >-
      {{ sahabino_verify_expected_services_command.stdout_lines
         | reject('equalto', '') | unique | list }}
    sahabino_missing_services: >-
      {{ (sahabino_verify_expected_services_command.stdout_lines
          | reject('equalto', '') | unique | list)
         | difference(sahabino_running_services_command.stdout_lines) }}

- name: Capture bounded status for each missing service
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['ps', '--all', item] }}"
    chdir: "{{ sahabino_app_dir }}"
  loop: "{{ sahabino_missing_services }}"
  register: sahabino_missing_service_status
  changed_when: false
  failed_when: false

- name: Capture bounded recent logs for each missing service
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['logs', '--tail', '120', item] }}"
    chdir: "{{ sahabino_app_dir }}"
  loop: "{{ sahabino_missing_services }}"
  register: sahabino_missing_service_logs
  changed_when: false
  failed_when: false

- name: Show missing-service diagnostics
  ansible.builtin.debug:
    msg:
      missing_services: "{{ sahabino_missing_services }}"
      status: "{{ sahabino_missing_service_status.results | default([]) | map(attribute='stdout') | list }}"
      recent_logs: "{{ sahabino_missing_service_logs.results | default([]) | map(attribute='stdout') | list }}"
  when: sahabino_missing_services | length > 0

- name: Verify every service in the merged production model is running
  ansible.builtin.assert:
    that:
      - sahabino_required_production_services | difference(sahabino_verify_expected_services) | length == 0
      - sahabino_missing_services | length == 0
    fail_msg: "Missing/non-running production services: {{ sahabino_missing_services | join(', ') }}"

- name: Resolve the running SeaweedFS container ID
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['ps', '--quiet', 'seaweedfs'] }}"
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_seaweedfs_container_id
  changed_when: false

- name: Require exactly one running SeaweedFS container
  ansible.builtin.assert:
    that:
      - sahabino_seaweedfs_container_id.stdout_lines | reject('equalto', '') | list | length == 1
    fail_msg: Docker Compose did not resolve exactly one running SeaweedFS container for port verification.

- name: Inspect the actual SeaweedFS container publication
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --type
      - container
      - "{{ sahabino_seaweedfs_container_id.stdout | trim }}"
  register: sahabino_seaweedfs_container_inspect
  changed_when: false
  no_log: true

- name: Record the expected and actual SeaweedFS host bindings
  ansible.builtin.set_fact:
    sahabino_expected_seaweedfs_host_ip: >-
      {{ (sahabino_object_storage_exposure == 'private')
         | ternary('127.0.0.1', sahabino_object_storage_bind_address) }}
    sahabino_actual_seaweedfs_bindings: >-
      {{ (sahabino_seaweedfs_container_inspect.stdout | from_json | first).NetworkSettings.Ports['8333/tcp']
         | default([], true) }}

- name: Verify the actual SeaweedFS host port matches the selected exposure
  ansible.builtin.assert:
    that:
      - sahabino_actual_seaweedfs_bindings | length == 1
      - sahabino_actual_seaweedfs_bindings | map(attribute='HostPort') | list == ['8333']
      - >-
        sahabino_actual_seaweedfs_bindings | map(attribute='HostIp') | list
        == [sahabino_expected_seaweedfs_host_ip]
      - >-
        sahabino_object_storage_exposure != 'public'
        or sahabino_expected_seaweedfs_host_ip not in ['127.0.0.1', '::1']
    fail_msg: >-
      SeaweedFS exposure mismatch: expected {{ sahabino_object_storage_exposure }} binding
      {{ sahabino_expected_seaweedfs_host_ip }}:8333, but Docker reports
      {{ sahabino_actual_seaweedfs_bindings | to_nice_json }}. Re-run the production deploy
      so the SeaweedFS-only reconciliation recreates the container with the selected exposure.

- name: Inspect the root-protected SeaweedFS host directory and credential
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  loop:
    - "{{ sahabino_seaweedfs_secret_dir }}"
    - "{{ sahabino_seaweedfs_config_path }}"
  register: sahabino_seaweedfs_host_paths

- name: Verify the SeaweedFS host secret permission contract
  ansible.builtin.assert:
    that:
      - sahabino_seaweedfs_host_paths.results[0].stat.isdir
      - not sahabino_seaweedfs_host_paths.results[0].stat.islnk
      - sahabino_seaweedfs_host_paths.results[0].stat.pw_name == "root"
      - sahabino_seaweedfs_host_paths.results[0].stat.gr_name == "root"
      - sahabino_seaweedfs_host_paths.results[0].stat.mode == "0700"
      - sahabino_seaweedfs_host_paths.results[1].stat.isreg
      - not sahabino_seaweedfs_host_paths.results[1].stat.islnk
      - sahabino_seaweedfs_host_paths.results[1].stat.pw_name == "root"
      - sahabino_seaweedfs_host_paths.results[1].stat.gr_name == "root"
      - sahabino_seaweedfs_host_paths.results[1].stat.mode == "0600"
      - sahabino_seaweedfs_host_paths.results[1].stat.size | int > 0
    fail_msg: The SeaweedFS host credential permission audit failed.

- name: Verify the staged SeaweedFS credential and exact PID 1 identity
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'exec', '-T', '--user', '0', 'seaweedfs', 'sh', '-s', '--', '--verify-runtime'
      ] }}
    chdir: "{{ sahabino_app_dir }}"
    stdin: "{{ lookup('ansible.builtin.file', sahabino_app_dir + '/infrastructure/network/seaweedfs-entrypoint.sh') }}"
    stdin_add_newline: false
  register: sahabino_seaweed_runtime_audit
  changed_when: false
  failed_when: false

- name: Require a valid SeaweedFS runtime security audit
  ansible.builtin.assert:
    that:
      - sahabino_seaweed_runtime_audit.rc == 0
      - "'SEAWEEDFS_RUNTIME_VERIFIED' in sahabino_seaweed_runtime_audit.stdout"
    fail_msg: >-
      SeaweedFS runtime identity or staged credential audit failed:
      {{ sahabino_seaweed_runtime_audit.stderr | default('') | trim | truncate(600, true) }}

- name: Verify the configured capture bucket without creating it
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'exec', '-T', 'api', 'uv', 'run', '--no-sync', 'python', '-c',
        'from sahabino.common.config import get_settings; from sahabino.network.storage import S3ObjectStorage; storage = S3ObjectStorage(get_settings()); storage._client.head_bucket(Bucket=storage._bucket)'
      ] }}
    chdir: "{{ sahabino_app_dir }}"
  changed_when: false
  no_log: true

- name: Verify TShark is available in the running analyzer
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['exec', '-T', 'network-analyzer', 'tshark', '--version'] }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: false

- name: Verify the analyzer reaches Kafka Stable state with at least one member
  ansible.builtin.command:
    argv: >-
      {{ [
        'python3', sahabino_app_dir + '/deploy/ansible/tools/kafka_group_health.py',
        '--timeout', '180', '--interval', '5', '--cwd', sahabino_app_dir, '--'
      ] + sahabino_compose_cli + [
        'exec', '-T', 'kafka', 'timeout', '60s',
        '/opt/kafka/bin/kafka-consumer-groups.sh',
        '--bootstrap-server', 'localhost:19092', '--describe', '--state',
        '--group', sahabino_network_analyzer_consumer_group_id
      ] }}
  changed_when: false

- name: Require running application containers to match all newly built image IDs
  ansible.builtin.command:
    argv:
      - python3
      - "{{ sahabino_app_dir }}/deploy/ansible/tools/release_containers.py"
      - verify
      - --project
      - "{{ sahabino_compose_project_name }}"
      - --revision
      - "{{ sahabino_deploy_revision }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: false

- name: Require HEAD to equal the operator-selected exact commit
  ansible.builtin.assert:
    that:
      - sahabino_resolved_revision == sahabino_deploy_revision
    fail_msg: Checkout/desired revision mismatch; do not mark this deployment successful.

# Final marker is written atomically by the launcher only AFTER its additional
# post-playbook verification succeeds; a failed wrapper must not claim success.
