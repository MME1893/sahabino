---
- name: Build the application images from the checked-out revision
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['build', '--pull'] + sahabino_application_services }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: true

- name: Start SeaweedFS before interrupting existing application workers
  community.docker.docker_compose_v2:
    project_src: "{{ sahabino_app_dir }}"
    files: "{{ sahabino_compose_files }}"
    env_files: [.env]
    project_name: "{{ sahabino_compose_project_name }}"
    profiles: "{{ sahabino_compose_profiles }}"
    services: [seaweedfs]
    state: present
    wait: true
    wait_timeout: 120

- name: Initialize or verify the production capture bucket
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['run', '--rm', '--no-deps', 'api', 'uv', 'run', '--no-sync', 'python', '-m', 'sahabino.network', 'storage-init'] }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: "'Capture bucket created' in sahabino_storage_init.stdout"
  register: sahabino_storage_init
  no_log: true

- name: Check whether a crawler container already exists
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['ps', '-q', 'crawler'] }}"
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_existing_crawler
  changed_when: false

- name: Wait for persisted active crawl runs to drain
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['exec', '-T', 'postgres', 'psql', '--no-psqlrc', '--tuples-only', '--no-align', '--username', vault_sahabino_postgres_user, '--dbname', vault_sahabino_postgres_db, '--command', \"SELECT COUNT(*) FROM crawl_runs WHERE status IN ('pending','running');\"] }}"
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_active_crawls
  changed_when: false
  retries: "{{ ((sahabino_crawler_drain_timeout_seconds | int) / (sahabino_crawler_drain_poll_seconds | int)) | round(0, 'ceil') | int }}"
  delay: "{{ sahabino_crawler_drain_poll_seconds }}"
  until: sahabino_active_crawls.stdout | trim == '0'
  failed_when: false
  when:
    - sahabino_existing_crawler.stdout | trim | length > 0

- name: Ask before interrupting a crawl that exceeded the drain timeout
  ansible.builtin.pause:
    prompt: >-
      Active crawler work is still running.
      1) Abort deployment (default/recommended)
      2) Explicitly interrupt and continue
      Enter 2 to continue
  register: sahabino_crawler_interruption_choice
  when:
    - sahabino_existing_crawler.stdout | trim | length > 0
    - sahabino_active_crawls.stdout | trim != '0'
    - sahabino_deploy_interactive | bool
    - not (sahabino_allow_active_crawl_interruption | bool)

- name: Record an explicit interactive crawler interruption decision
  ansible.builtin.set_fact:
    sahabino_allow_active_crawl_interruption: true
  when:
    - sahabino_crawler_interruption_choice.user_input | default('') == '2'

- name: Abort rather than implicitly interrupt an active crawl
  ansible.builtin.assert:
    that:
      - (sahabino_allow_active_crawl_interruption | bool) or (sahabino_active_crawls.stdout | trim == '0')
    fail_msg: An active crawl did not drain before the timeout; retry later or explicitly allow interruption.
  when:
    - sahabino_existing_crawler.stdout | trim | length > 0

- name: Perform final persisted crawl-state race check
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['exec', '-T', 'postgres', 'psql', '--no-psqlrc', '--tuples-only', '--no-align', '--username', vault_sahabino_postgres_user, '--dbname', vault_sahabino_postgres_db, '--command', \"SELECT COUNT(*) FROM crawl_runs WHERE status IN ('pending','running');\"] }}"
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_final_active_crawls
  changed_when: false
  when:
    - sahabino_existing_crawler.stdout | trim | length > 0
    - not (sahabino_allow_active_crawl_interruption | bool)

- name: Refuse a crawl that started during deployment
  ansible.builtin.assert:
    that:
      - sahabino_allow_active_crawl_interruption | bool or sahabino_final_active_crawls.stdout | default('0') | trim == '0'
    fail_msg: A crawl started immediately before worker replacement; deployment stopped safely.
  when:
    - sahabino_existing_crawler.stdout | trim | length > 0
    - not (sahabino_allow_active_crawl_interruption | bool)

- name: Stop database-writing application services before migration
  community.docker.docker_compose_v2:
    project_src: "{{ sahabino_app_dir }}"
    files: "{{ sahabino_compose_files }}"
    env_files:
      - .env
    project_name: "{{ sahabino_compose_project_name }}"
    profiles: "{{ sahabino_compose_profiles }}"
    services: "{{ sahabino_database_writers }}"
    state: stopped

- name: Start PostgreSQL, Kafka, and SeaweedFS and wait for Compose health checks
  community.docker.docker_compose_v2:
    project_src: "{{ sahabino_app_dir }}"
    files: "{{ sahabino_compose_files }}"
    env_files:
      - .env
    project_name: "{{ sahabino_compose_project_name }}"
    profiles: "{{ sahabino_compose_profiles }}"
    services: "{{ sahabino_infrastructure_services }}"
    state: present
    wait: true
    wait_timeout: 120

- name: Verify PostgreSQL readiness explicitly
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'exec', '-T', 'postgres', 'pg_isready', '--quiet',
        '--username', vault_sahabino_postgres_user,
        '--dbname', vault_sahabino_postgres_db
      ] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_postgres_ready
  changed_when: false
  retries: "{{ sahabino_healthcheck_retries }}"
  delay: "{{ sahabino_healthcheck_delay_seconds }}"
  until: sahabino_postgres_ready.rc == 0

- name: Verify Kafka readiness explicitly
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'exec', '-T', 'kafka',
        '/opt/kafka/bin/kafka-broker-api-versions.sh',
        '--bootstrap-server', 'localhost:19092'
      ] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_kafka_ready
  changed_when: false
  retries: "{{ sahabino_healthcheck_retries }}"
  delay: "{{ sahabino_healthcheck_delay_seconds }}"
  until: sahabino_kafka_ready.rc == 0

- name: Apply Alembic migrations explicitly
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'run', '--rm', '--no-deps', 'api',
        'uv', 'run', '--no-sync', 'alembic', 'upgrade', 'head'
      ] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_alembic_upgrade
  changed_when: true

- name: Read the Alembic code head
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'run', '--rm', '--no-deps', 'api',
        'uv', 'run', '--no-sync', 'alembic', 'heads'
      ] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_alembic_code_heads
  changed_when: false

- name: Read the database Alembic revision
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'exec', '-T', 'postgres', 'psql', '--no-psqlrc',
        '--tuples-only', '--no-align',
        '--username', vault_sahabino_postgres_user,
        '--dbname', vault_sahabino_postgres_db,
        '--command', 'SELECT version_num FROM alembic_version;'
      ] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_alembic_database_head
  changed_when: false

- name: Verify the database is at the checked-out Alembic head
  ansible.builtin.assert:
    that:
      - sahabino_alembic_database_head.stdout | trim | length > 0
      - (sahabino_alembic_database_head.stdout | trim) in sahabino_alembic_code_heads.stdout
    fail_msg: The database Alembic revision does not match the checked-out code head.

- name: Provision and verify the required Kafka topic topology
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'run', '--rm', '--no-deps', 'api',
        'uv', 'run', '--no-sync', 'python', '-m', 'sahabino.messaging.admin'
      ] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_kafka_topics
  changed_when: "'Created Kafka topics:' in sahabino_kafka_topics.stdout"

- name: Start or update application and observability services
  community.docker.docker_compose_v2:
    project_src: "{{ sahabino_app_dir }}"
    files: "{{ sahabino_compose_files }}"
    env_files:
      - .env
    project_name: "{{ sahabino_compose_project_name }}"
    profiles: "{{ sahabino_compose_profiles }}"
    services: "{{ sahabino_application_services + sahabino_observability_services }}"
    state: present
    wait: true
    wait_timeout: 120
