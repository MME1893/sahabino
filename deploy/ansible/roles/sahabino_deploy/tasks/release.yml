---
# A successful daemon pull does not help if BuildKit is forced to query GHCR
# again for every build. Prefer the already verified local base images and
# explicitly fetch only missing pinned tags, with bounded retries.
- name: Check snapshot capacity before downloading or building images
  ansible.builtin.command:
    argv:
      - python3
      - "{{ sahabino_app_dir }}/deploy/ansible/tools/release_backup.py"
      - --preflight-only
      - --project
      - "{{ sahabino_compose_project_name }}"
      - --backup-root
      - "{{ sahabino_release_backup_dir }}"
      - --app
      - "{{ sahabino_app_dir }}"
      - --vault-password-file
      - "{{ sahabino_backup_vault_password_file }}"
      - --margin-bytes
      - "{{ sahabino_release_backup_margin_bytes | string }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: false

- name: Inspect required application base images locally
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ item }}"
  loop:
    - python:3.12-slim
    - python:3.12-slim-bookworm
    - ghcr.io/astral-sh/uv:0.12.1
  register: sahabino_base_image_inspection
  changed_when: false
  failed_when: false

- name: Pull missing application base images with bounded retries
  ansible.builtin.command:
    argv:
      - docker
      - image
      - pull
      - "{{ item.item }}"
  loop: "{{ sahabino_base_image_inspection.results }}"
  when: item.rc != 0
  register: sahabino_missing_base_image_pull
  retries: 3
  delay: 15
  until: sahabino_missing_base_image_pull.rc == 0
  changed_when: true

- name: Build the application images from the checked-out revision
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['build'] + sahabino_application_services }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: true

- name: Tag freshly built images with the exact selected release SHA
  ansible.builtin.command:
    argv:
      - docker
      - image
      - tag
      - "{{ sahabino_compose_project_name }}-{{ item }}:latest"
      - "{{ sahabino_compose_project_name }}-{{ item }}:{{ sahabino_deploy_revision }}"
  loop: "{{ sahabino_application_services }}"
  changed_when: true

- name: Recheck snapshot capacity after building images
  ansible.builtin.command:
    argv:
      - python3
      - "{{ sahabino_app_dir }}/deploy/ansible/tools/release_backup.py"
      - --preflight-only
      - --project
      - "{{ sahabino_compose_project_name }}"
      - --backup-root
      - "{{ sahabino_release_backup_dir }}"
      - --app
      - "{{ sahabino_app_dir }}"
      - --vault-password-file
      - "{{ sahabino_backup_vault_password_file }}"
      - --margin-bytes
      - "{{ sahabino_release_backup_margin_bytes | string }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: false

- name: Ensure the pinned external SeaweedFS image is available
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['pull', '--policy', 'missing', 'seaweedfs', 'postgres', 'kafka', 'grafana', 'loki', 'alloy'] }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: false

- name: Ensure SeaweedFS is running without recreating an existing data-bearing container
  ansible.builtin.command:
    argv: "{{ ['python3', sahabino_app_dir + '/deploy/ansible/tools/release_containers.py', 'ensure', '--project', sahabino_compose_project_name, '--service', 'seaweedfs', '--'] + sahabino_compose_cli }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: false

- name: Check SeaweedFS readiness directly without HTTP proxy
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + ['exec', '-T', 'seaweedfs', 'sh', '-c',
        'env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u all_proxy wget -q --spider http://127.0.0.1:9333/cluster/status'] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_seaweed_ready
  changed_when: false
  retries: "{{ sahabino_healthcheck_retries }}"
  delay: "{{ sahabino_healthcheck_delay_seconds }}"
  until: sahabino_seaweed_ready.rc == 0

# A running container can retain an OLD single-file bind mount across Git
# checkout, even when the host's entrypoint was updated. Stream the exact
# checked-out verifier into the existing container instead of executing its
# potentially stale mounted copy. No container/data recreation before backup.
- name: Verify SeaweedFS runtime before entering maintenance
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'exec', '-T', '--user', '0', 'seaweedfs', 'sh', '-s', '--', '--verify-runtime'
      ] }}
    chdir: "{{ sahabino_app_dir }}"
    stdin: "{{ lookup('ansible.builtin.file', sahabino_app_dir + '/infrastructure/network/seaweedfs-entrypoint.sh') }}"
    stdin_add_newline: false
  changed_when: false

- name: Initialize or verify the production capture bucket idempotently
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'run', '--rm', '--no-deps', 'api',
        'uv', 'run', '--no-sync', 'python', '-m', 'sahabino.network', 'storage-init'
      ] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_storage_initialization
  changed_when: "'Capture bucket created' in sahabino_storage_initialization.stdout"

- name: Wait for persisted crawler work to drain before stopping writers
  ansible.builtin.command:
    argv: >-
      {{ [
        'python3', sahabino_app_dir + '/deploy/ansible/tools/crawler_drain.py',
        'wait', '--timeout', sahabino_crawler_drain_timeout_seconds | string,
        '--poll', sahabino_crawler_drain_poll_seconds | string, '--'
      ] + sahabino_compose_cli }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_crawler_drain
  changed_when: false
  failed_when: false

- name: Fail safely when crawler-state verification itself failed
  ansible.builtin.assert:
    that:
      - sahabino_crawler_drain.rc in [0, 3, 4]
    fail_msg: >-
      Crawler-state verification failed (rc={{ sahabino_crawler_drain.rc }};
      stderr={{ sahabino_crawler_drain.stderr | default('') | trim | truncate(600, true) }}).
      Deployment is aborted without offering an interruption override because
      active work could not be proven safe.

- name: Ask whether to explicitly interrupt work that survived the drain timeout
  ansible.builtin.pause:
    prompt: |-
      Active crawler work is still running.
      1) Abort deployment (default / recommended)
      2) Explicitly interrupt active work and continue
      Enter 1 or 2
  register: sahabino_crawler_interruption_choice
  when:
    - sahabino_crawler_drain.rc == 3
    - sahabino_crawler_drain_interactive | bool
    - not (sahabino_allow_active_crawl_interruption | bool)

- name: Record explicit active-crawl interruption authorization
  ansible.builtin.set_fact:
    sahabino_crawler_interruption_authorized: >-
      {{ (sahabino_allow_active_crawl_interruption | bool)
         or ((sahabino_crawler_interruption_choice.user_input | default('')) == '2') }}

- name: Abort when active crawler work lacks explicit interruption authorization
  ansible.builtin.assert:
    that:
      - sahabino_crawler_drain.rc != 3 or sahabino_crawler_interruption_authorized | bool
    fail_msg: Active crawler work remained after the drain timeout; deployment is safely aborted.

- name: Perform the final authoritative crawler race-window check
  ansible.builtin.command:
    argv: >-
      {{ [
        'python3', sahabino_app_dir + '/deploy/ansible/tools/crawler_drain.py', 'final'
      ]
      + ((sahabino_crawler_interruption_authorized | bool)
         | ternary(['--allow-active-interruption'], []))
      + ['--'] + sahabino_compose_cli }}
    chdir: "{{ sahabino_app_dir }}"
  changed_when: false
  when: sahabino_crawler_drain.rc != 4

- name: Mark the transition to the controlled maintenance window
  ansible.builtin.set_fact:
    sahabino_deployment_writer_stop_started: true

- name: Stop application writers before the consistent backup and migration
  ansible.builtin.command:
    argv:
      - python3
      - "{{ sahabino_app_dir }}/deploy/ansible/tools/release_containers.py"
      - stop-app
      - --project
      - "{{ sahabino_compose_project_name }}"
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_writer_stop
  changed_when: "sahabino_writer_stop.stdout | trim != 'STOPPED:'"

- name: Ensure PostgreSQL and Kafka are running without recreating existing data containers
  ansible.builtin.command:
    argv: "{{ ['python3', sahabino_app_dir + '/deploy/ansible/tools/release_containers.py', 'ensure', '--project', sahabino_compose_project_name, '--service', item, '--'] + sahabino_compose_cli }}"
    chdir: "{{ sahabino_app_dir }}"
  loop: "{{ sahabino_infrastructure_services }}"
  changed_when: false

- name: Verify PostgreSQL readiness explicitly
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'exec', '-T', 'postgres', 'pg_isready', '--quiet',
        '--username', vault_sahabino_postgres_user,
        '--dbname', vault_sahabino_postgres_db
      ] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_postgres_ready
  changed_when: false
  retries: "{{ sahabino_healthcheck_retries }}"
  delay: "{{ sahabino_healthcheck_delay_seconds }}"
  until: sahabino_postgres_ready.rc == 0

- name: Verify Kafka readiness explicitly
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'exec', '-T', 'kafka',
        '/opt/kafka/bin/kafka-broker-api-versions.sh',
        '--bootstrap-server', 'localhost:19092'
      ] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_kafka_ready
  changed_when: false
  retries: "{{ sahabino_healthcheck_retries }}"
  delay: "{{ sahabino_healthcheck_delay_seconds }}"
  until: sahabino_kafka_ready.rc == 0

- name: Create a second PostgreSQL backup after writers have stopped
  ansible.builtin.set_fact:
    sahabino_backup_kind: pre-deploy
    sahabino_backup_label: "consistent-{{ sahabino_deploy_revision }}"

- name: Verify the database snapshot from the quiescent writer checkpoint
  ansible.builtin.include_role:
    name: sahabino_backup
    tasks_from: run

- name: Require a verified PostgreSQL dump before persistent-data snapshot
  ansible.builtin.assert:
    that:
      - sahabino_created_backup_path is defined
      - sahabino_backup_command.stdout is match('^CREATED:')
    fail_msg: The consistent pre-migration PostgreSQL dump was not created.

- name: Snapshot Kafka, SeaweedFS, observability and encrypted secrets to local disk
  ansible.builtin.command:
    argv:
      - python3
      - "{{ sahabino_app_dir }}/deploy/ansible/tools/release_backup.py"
      - --project
      - "{{ sahabino_compose_project_name }}"
      - --backup-root
      - "{{ sahabino_release_backup_dir }}"
      - --app
      - "{{ sahabino_app_dir }}"
      - --pg-dump
      - "{{ sahabino_created_backup_path }}"
      - --vault-password-file
      - "{{ sahabino_backup_vault_password_file }}"
      - --margin-bytes
      - "{{ sahabino_release_backup_margin_bytes | string }}"
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_release_backup
  changed_when: true
  # This output contains paths, sizes and status, never secret values.

- name: Require the persistent-data backup manifest before any migration
  ansible.builtin.assert:
    that:
      - sahabino_release_backup.stdout is search('BACKUP_VERIFIED:')
    fail_msg: Persistent-data snapshot did not complete; refusing migration.

- name: Remove only stopped and mount-free application containers with missing images
  ansible.builtin.command:
    argv:
      - python3
      - "{{ sahabino_app_dir }}/deploy/ansible/tools/release_containers.py"
      - remove-stale
      - --project
      - "{{ sahabino_compose_project_name }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: "sahabino_stale_cleanup.stdout | trim != 'REMOVED:'"
  register: sahabino_stale_cleanup

- name: Resolve the successful full-snapshot manifest path
  ansible.builtin.set_fact:
    sahabino_release_backup_manifest: >-
      {{ (sahabino_release_backup.stdout_lines
          | select('match', '^BACKUP_VERIFIED:') | list | last)
          | regex_replace('^BACKUP_VERIFIED:', '') }}/manifest.json

- name: Remove stale SeaweedFS or observability containers only after verifying their volume backups
  ansible.builtin.command:
    argv:
      - python3
      - "{{ sahabino_app_dir }}/deploy/ansible/tools/release_containers.py"
      - remove-stale-persisted
      - --project
      - "{{ sahabino_compose_project_name }}"
      - --backup-manifest
      - "{{ sahabino_release_backup_manifest }}"
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_persisted_stale_cleanup
  changed_when: "sahabino_persisted_stale_cleanup.stdout | trim != 'REMOVED_PERSISTED:'"

- name: Reconcile SeaweedFS healthcheck and configuration after the verified snapshot
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['up', '-d', '--no-deps', '--no-build', '--pull', 'never', 'seaweedfs'] }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: true

- name: Wait for SeaweedFS health after controlled reconciliation
  ansible.builtin.command:
    argv: "{{ ['docker', 'inspect', '--format', '{{.State.Health.Status}}', sahabino_compose_project_name + '-seaweedfs-1'] }}"
  register: sahabino_seaweed_post_backup_health
  changed_when: false
  retries: 30
  delay: 3
  until: sahabino_seaweed_post_backup_health.stdout | trim == 'healthy'

- name: Recheck Kafka readiness after the cold snapshot restart
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + ['exec', '-T', 'kafka',
        '/opt/kafka/bin/kafka-broker-api-versions.sh',
        '--bootstrap-server', 'localhost:19092'] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_post_snapshot_kafka_ready
  changed_when: false
  retries: 30
  delay: 3
  until: sahabino_post_snapshot_kafka_ready.rc == 0

- name: Apply Alembic migrations explicitly
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'run', '--rm', '--no-deps', 'api',
        'uv', 'run', '--no-sync', 'alembic', 'upgrade', 'head'
      ] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_alembic_upgrade
  changed_when: true

- name: Read the Alembic code head
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'run', '--rm', '--no-deps', 'api',
        'uv', 'run', '--no-sync', 'alembic', 'heads'
      ] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_alembic_code_heads
  changed_when: false

- name: Read the database Alembic revision
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'exec', '-T', 'postgres', 'psql', '--no-psqlrc',
        '--tuples-only', '--no-align',
        '--username', vault_sahabino_postgres_user,
        '--dbname', vault_sahabino_postgres_db,
        '--command', 'SELECT version_num FROM alembic_version;'
      ] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_alembic_database_head
  changed_when: false

- name: Verify the database is at the checked-out Alembic head
  ansible.builtin.assert:
    that:
      - sahabino_alembic_database_head.stdout | trim | length > 0
      - sahabino_alembic_code_heads.stdout_lines | reject('equalto', '') | list | length == 1
      - >-
        (sahabino_alembic_database_head.stdout | trim)
        == ((sahabino_alembic_code_heads.stdout_lines
             | reject('equalto', '') | list | first)
            | regex_replace('\\s+\\(head\\)$', ''))
    fail_msg: The database Alembic revision does not match the checked-out code head.

- name: Configure the optional least-privilege Grafana PostgreSQL reader
  ansible.builtin.include_tasks: grafana_postgres.yml

- name: Provision and verify the required Kafka topic topology
  ansible.builtin.command:
    argv: >-
      {{ sahabino_compose_cli + [
        'run', '--rm', '--no-deps', 'api',
        'uv', 'run', '--no-sync', 'python', '-m', 'sahabino.messaging.admin'
      ] }}
    chdir: "{{ sahabino_app_dir }}"
  register: sahabino_kafka_topics
  changed_when: "'Created Kafka topics:' in sahabino_kafka_topics.stdout"

# API must reach health before crawler starts: --no-deps bypasses Compose's
# depends_on ordering, so starting all workers simultaneously is unsafe.
- name: Start the newly built API and wait for its health before worker recreation
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['up', '-d', '--no-deps', '--no-build', '--pull', 'never', '--force-recreate', '--wait', '--wait-timeout', '120', 'api'] }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: true

- name: Recreate ingestion and network analyzer after API readiness
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['up', '-d', '--no-deps', '--no-build', '--pull', 'never', '--force-recreate', '--wait', '--wait-timeout', '120', 'ingestion', 'network-analyzer'] }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: true

- name: Recreate the crawler only after API and other workers are started
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['up', '-d', '--no-deps', '--no-build', '--pull', 'never', '--force-recreate', '--wait', '--wait-timeout', '120', 'crawler'] }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: true

- name: Start or reconcile observability without deleting its persisted volumes
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['up', '-d', '--no-deps', '--no-build', '--pull', 'never'] + sahabino_observability_services }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: true

- name: Wait for all application and observability services to become ready
  ansible.builtin.command:
    argv: "{{ sahabino_compose_cli + ['up', '-d', '--no-deps', '--no-build', '--pull', 'never', '--wait', '--wait-timeout', '120'] + sahabino_application_services + sahabino_observability_services }}"
    chdir: "{{ sahabino_app_dir }}"
  changed_when: false
