---
- name: Deploy an explicit Sahabino Git revision
  hosts: production
  become: true
  gather_facts: true
  serial: 1
  tasks:
    - name: Run pre-deployment checks
      ansible.builtin.include_role:
        name: sahabino_deploy
        tasks_from: preflight

    - name: Back up PostgreSQL before changing the checked-out revision
      ansible.builtin.include_role:
        name: sahabino_backup
        tasks_from: pre_deploy

    - name: Fetch and check out the requested revision
      ansible.builtin.include_role:
        name: sahabino_deploy
        tasks_from: checkout

    - name: Render and validate production configuration
      ansible.builtin.include_role:
        name: sahabino_deploy
        tasks_from: configure

    - name: Apply and verify a fail-closed release
      block:
        - name: Build, migrate, provision topics, and update services
          ansible.builtin.include_role:
            name: sahabino_deploy
            tasks_from: release

        - name: Verify and record the successful deployment
          ansible.builtin.include_role:
            name: sahabino_deploy
            tasks_from: verify
      rescue:
        - name: Stop application writers on failed migration or verification after interruption began
          ansible.builtin.command:
            argv:
              - python3
              - "{{ sahabino_app_dir }}/deploy/ansible/tools/release_containers.py"
              - stop-app
              - --project
              - "{{ sahabino_compose_project_name }}"
            chdir: "{{ sahabino_app_dir }}"
          changed_when: true
          failed_when: false
          when: sahabino_deployment_writer_stop_started | default(false) | bool

        - name: Abort without automatically restoring or reverting the database
          ansible.builtin.fail:
            msg: >-
              Release failed. If the maintenance window began, application writers
              were stopped to prevent additional writes. No database restore or
              image rollback was performed; inspect backup manifest and logs.
