[project]
name = "sahabino"
version = "0.1.0"
description = "Application intelligence and network analytics data pipeline"
readme = "README.md"
authors = [
    { name = "Mohammad", email = "133509735+MME1893@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "fastapi",
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3,<4",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn",
]

[project.scripts]
sahabino = "sahabino:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio",
    "ruff>=0.16.6",
    "testcontainers[postgres]",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.ruff.lint.isort]
known-first-party = ["sahabino"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
pretty = true
